[workspace]
resolver = "2"
members = [
  "rust/crates/prs-model",
  "rust/crates/prs-core",
  "rust/crates/prs-providers",
  "rust/crates/prs-store",
  "rust/crates/prs-winui-projection",
  "rust/crates/prs-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "UNLICENSED"
repository = "https://github.com/godlytalias/PullRequestScanner"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
windows-core = "0.62"
windows = { version = "0.62", features = ["Foundation", "System", "UI_Text"] }
naui = "0.20.1"
naui-winui3 = "0.20.1"
