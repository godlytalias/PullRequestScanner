name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include a minimal safe reproduction. Do not include tokens or private PR content.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, .NET SDK, Git version, and provider type.
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy check
      options:
        - label: I removed tokens, private code, private PR content, and local paths from this report.
          required: true
