name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            tests/**/*.csproj

      - name: Restore
        run: dotnet restore .\PullRequestScanner.sln --configfile .\NuGet.config

      - name: Verify formatting
        run: dotnet format .\PullRequestScanner.sln --no-restore --verify-no-changes

      - name: Test
        run: dotnet test .\tests\PullRequestScanner.Core.Tests\PullRequestScanner.Core.Tests.csproj -c Release --no-restore

      - name: Build Debug x64
        run: dotnet build .\src\PullRequestScanner.App\PullRequestScanner.App.csproj -c Debug -r win-x64 --no-restore -p:Platform=x64

      - name: Build Release x64
        run: dotnet build .\src\PullRequestScanner.App\PullRequestScanner.App.csproj -c Release -r win-x64 --no-restore -p:Platform=x64
